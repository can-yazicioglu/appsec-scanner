[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-scanner"
version = "0.1.0"
description = "A local, evidence-driven AppSec scanner and read-only dashboard"
requires-python = ">=3.11"
dependencies = ["requests>=2.32.4,<3", "beautifulsoup4>=4.13,<5", "Flask>=3.1,<4"]

[project.optional-dependencies]
browser = ["playwright>=1.51,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
appsec = "appsec.cli:main"

[tool.setuptools.packages.find]
include = ["appsec*"]

[tool.setuptools.package-data]
"appsec.dashboard" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: requires installed Playwright Chromium"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
