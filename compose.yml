services:
  juice-shop:
    image: bkimminich/juice-shop:v19.2.1
    ports:
      - "127.0.0.1:3000:3000"
    networks: [lab]
  scanner:
    build: .
    profiles: [tools]
    volumes:
      - results:/data
      - ./examples:/examples:ro
    networks: [lab]
    command: ["scan", "http://juice-shop:3000", "--allow-host", "juice-shop", "--spa", "--endpoint", "http://juice-shop:3000/rest/products/search?q=apple"]
  dashboard:
    build: .
    profiles: [tools]
    volumes:
      - results:/data:ro
    ports:
      - "127.0.0.1:5000:5000"
    command: ["dashboard", "--host", "0.0.0.0", "--port", "5000"]
    networks: [lab]
  dvwa:
    profiles: [dvwa]
    build:
      context: https://github.com/digininja/DVWA.git#a96943dc1f52f390ee5df72144660636c4b7dd06
    environment:
      DB_SERVER: dvwa-db
      DB_DATABASE: dvwa
      DB_USER: dvwa
      DB_PASSWORD: ${DVWA_DB_PASSWORD:-local-lab-only}
      DEFAULT_SECURITY_LEVEL: low
    depends_on:
      dvwa-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4280:80"
    networks: [lab]
  dvwa-db:
    profiles: [dvwa]
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${DVWA_DB_ROOT_PASSWORD:-local-root-lab-only}
      MARIADB_DATABASE: dvwa
      MARIADB_USER: dvwa
      MARIADB_PASSWORD: ${DVWA_DB_PASSWORD:-local-lab-only}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - dvwa-data:/var/lib/mysql
    networks: [lab]
networks:
  lab:
volumes:
  results:
  dvwa-data:
